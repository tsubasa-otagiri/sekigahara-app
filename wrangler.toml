# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  HONNOJI no HEN 案件管理 — Cloudflare Pages 設定
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
#  ▶ 公開 URL:
#      https://honnoji-app.pages.dev/
#
#  GitHub push → Cloudflare Pages が自動ビルド＆デプロイ
#
#  【重要】
#  pages_build_output_dir を指定することで Cloudflare Pages が
#  このファイルを「有効な Pages 設定」として認識し、
#  ダッシュボードで設定した Build command（npm run build）を
#  正しく実行する。
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

name                    = "honnoji-app"
pages_build_output_dir  = "dist"
compatibility_date      = "2024-11-01"
