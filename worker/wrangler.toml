name            = "kpi-dashboard"
main            = "index.js"
compatibility_date = "2024-11-01"
account_id      = "b1de89472c3d33b4cb527252dbec9cb8"

# ── KV Namespace ──────────────────────────────────────
[[kv_namespaces]]
binding = "KV"
id      = "30733344d83840aabc5e2bd3a59b70a6"

# ── 環境変数 ──────────────────────────────────────────
# ALLOWED_IPS: カンマ区切りの許可IPアドレス一覧
#   ①主回線:        210.172.143.39
#   ②Mac用VPN回線: 210.172.143.37
#   ③追加回線:      210.172.130.69
# ※ Cloudflare Dashboard > Workers > kpi-dashboard > Settings > Variables
#    で上書き設定することも可能（Dashboard 側が優先される）
[vars]
# ── IPホワイトリスト（渋谷オフィス回線） ───────────────────
#   ①主回線:        210.172.143.39
#   ②Mac用VPN回線: 210.172.143.37
#   ③追加回線:      210.172.130.69
ALLOWED_IPS = "210.172.143.39,210.172.143.37,210.172.130.69"

# ── オプション: API キー認証 ───────────────────────────
# Cloudflare Dashboard > Workers > kpi-dashboard > Settings > Variables
# に API_KEY を追加することで有効化（設定しなければ認証なし）
# ──────────────────────────────────────────────────────

# ── アクセスログ ──────────────────────────────────────
# Cloudflare Dashboard > Workers > kpi-dashboard > Logs でリアルタイム確認可能
# ログ形式: { level, event, ip, method, path, ts, ua }
# ──────────────────────────────────────────────────────
